# Engineer in the Loop: who may confirm what.
#
# Copy this to `eil-config.yml` in this directory to change it. A machine-local override can go in
# `local-config.yml` (keep it out of version control). An empty list means "the story's developer",
# who is the story's owner, `default_developer`, or the person named by `git config user.name` or
# `user.email`. One listed person's confirmation is enough (FR-066). The same list also decides who
# may record an override for that stage (FR-045).

default_developer: null

approvers:
  requirements: []
  functional: []
  technical: []
  completion: []
  # The derived stages are never approved, but review answers and carried-forward sign-offs on them
  # need a confirmer. An empty list means the `technical` list, then the story's developer.
  ai-spec: []
  plan: []
  tasks: []
  verification: []

# Who may abbreviate a stage (empty means the story's developer).
abbreviation_authorisers: []

# Branches a new story may be started on without asking (any other branch must be named for the story,
# for example `003-...` for story 003, or a person confirms it once).
main_branches: [main, master]

review:
  # Review lists of at most this many entries are walked one entry at a time; longer ones are shown as
  # a grouped summary answered in one reply.
  one_at_a_time_max: 8

  # The browser review page (`eil review serve`) stops after this many minutes without use. Answers
  # given on it are stored as they are given, so stopping loses nothing.
  page_idle_minutes: 60

  # Diagrams on the review page are shown as source. Name one https: script here (a Mermaid ES module,
  # for example) and the browser loads it to draw them; the helper itself never fetches anything.
  diagram_script: null
