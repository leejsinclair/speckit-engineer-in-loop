name: release

# Push a tag such as v0.1.0 to publish the two install archives on a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the archives (refuses if the manifests do not carry the tag's version)
        run: python3 tools/stage.py dist --archives --tag "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
